repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix, src/, scripts/, tests/]
      - id: ruff-format
        args: [src/, scripts/, tests/]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: [src/, --ignore-missing-imports, --no-namespace-packages]
        pass_filenames: false
        additional_dependencies: [torch, numpy, pandas, matplotlib, pyyaml, scikit-fem]
