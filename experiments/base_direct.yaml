formulation: direct

beam:
  width: 0.1
  height: 0.001

material:
  E: 2.0e9
  NU: 0.29
  G: 775000000.0
  d31: 2.2e-11
  d33: -3.0e-11
  rel_permittivity: 12

arch:
  hidden_sizes:
    - 100
    - 250
  activation: tanh
  model_type: pyramid

training:
  epochs_adam: 3000
  epochs_lbfgs: 0
  lr_adam: 0.005
  lr_lbfgs: 0.0001
  data_fraction: 0.75
  adaptive_weight_f: 200
  data_suffix: _m1_d
  gradient_clip: 0.5
  adaptive_alpha: 0.9
  lr_step_size: 5000
  lr_gamma: 0.95
  early_stop_patience: 200
  early_stop_min_delta: 1.0e-8
  normalize_inputs: false

geometry:
  n_points: 400
  n_collocation: 150
  n_collocation_test: 200

loading:
  voltage: 100.0
  applied_force_y: 0.1

run:
  seed: null
  name: null
